# CKAD Deployment 複習筆記
# 用途：集中展示常考設定；不保證可直接 kubectl apply（例如某些設定值需依情境調整）。
# Deployment → ReplicaSet → Pod；修改 spec.template 會觸發新 Revision / Rollout。
apiVersion: apps/v1                 # Deployment 使用 apps/v1
kind: Deployment
metadata:
  name: myapp-deployment           # Deployment 名稱
  namespace: default               # 所屬 Namespace
  labels:                          # Deployment 自身標籤，不等於 Pod 標籤
    app: myapp
    tier: frontend
  annotations:                     # 任意附加資訊，不用於 Label Selector
    description: "CKAD Deployment practice"

spec:
  # ============================================================
  # 1. 副本數與 Selector
  # ============================================================
  replicas: 6                      # 期望 Pod 數；預設 1；設為 0 可縮到零
  selector:                        # 選擇由 Deployment 管理的 Pod；apps/v1 建立後不可修改
    matchLabels:                   # 每個條件都要成立（AND）
      app: myapp
    matchExpressions:              # 與 matchLabels 也是 AND 關係
      - key: tier                  # 比對 Pod 上的 tier Label
        operator: In               # In：值在清單內；NotIn：值不在清單內（Key 不存在也符合）
        values:                    # In / NotIn 需要非空 values
          - frontend
          - backend
      - key: app
        operator: Exists           # Exists：Key 存在；DoesNotExist：Key 不存在；兩者不可填 values

  # ============================================================
  # 2. Pod Template：修改此區通常觸發新的 Deployment Revision
  # ============================================================
  template:                         # PodTemplateSpec，放入 Pod 的 metadata 與 spec
    metadata:
      labels:
        app: myapp                  # 必須符合 spec.selector
    spec:
      containers: []                # 此處填入 Pod.spec.containers，其他設定參考 Pod.yaml

  # ============================================================
  # 3. Deployment 更新策略（RollingUpdate 與 Recreate 二選一）
  # ============================================================
  strategy:
    type: RollingUpdate           # RollingUpdate（預設）：漸進更新；Recreate：先停止舊 Pod 再建立新 Pod
    rollingUpdate:                # 僅 type=RollingUpdate 才能設定；Recreate 必須移除此區
      maxSurge: 25%               # 可超過 replicas 的 Pod 數；整數或百分比；百分比向上取整
      maxUnavailable: 25%         # 最多不可用 Pod 數；整數或百分比；百分比向下取整
      # 兩者不可同時為 0；replicas=6 → maxSurge=2，maxUnavailable=1
      # 更新期間最多 8 個 Pod，至少 5 個 Available Pod（受實際狀態影響）

  # ============================================================
  # 4. Rollout / Revision / Progress
  # ============================================================
  minReadySeconds: 0              # Pod Ready 後持續幾秒才算 Available；預設 0
  revisionHistoryLimit: 10        # 保留舊 ReplicaSet 供回滾；預設 10；0 會限制回滾能力
  progressDeadlineSeconds: 600    # 更新多久無進展視為逾期；預設 600，必須大於 minReadySeconds
                                 # 逾期會有 ProgressDeadlineExceeded，不會自動回滾
  paused: false                   # true：暫停 Rollout；false：恢復；暫停時不可 rollback

# ============================================================
# CKAD 高頻觀念與指令（以下是筆記，不是 YAML 設定）
# ============================================================
# Revision：修改 spec.template（image、Pod label/annotation 等）才會觸發新 Revision；單純 scale 不會。
# Deployment 更新 image 時建立/調整 ReplicaSet；直接改 RS template 不會自動替換既有 Pod。
# Service 依自身 selector 選 Pod，不直接選 Deployment；readinessProbe 影響是否進入可用端點。
# HPA 管理 replicas 時，手動 scale 可能稍後被 HPA 覆蓋。
# RollingUpdate 的 maxSurge / maxUnavailable 控制更新速度；Recreate 更新可能短暫中斷。
#
# k create deploy <NAME> --image=<IMAGE> --replicas=3    # 快速建立
# k create deploy <NAME> --image=<IMAGE> --dry-run=client -o yaml # 產生 YAML
# k get deploy,rs,po                                   # 查看控制器與 Pod
# k describe deploy <NAME>                             # 查看狀態與 Events
# k scale deploy/<NAME> --replicas=5                    # 調整副本數
# k set image deploy/<NAME> <CONTAINER>=<IMAGE>         # 更新 Image
# k rollout status deploy/<NAME>                       # 等待 Rollout 完成
# k rollout history deploy/<NAME>                      # 查看歷史
# k rollout history deploy/<NAME> --revision=2         # 指定 Revision 詳情
# k rollout undo deploy/<NAME>                         # 回滾上一版
# k rollout undo deploy/<NAME> --to-revision=2          # 回滾指定版
# k rollout restart deploy/<NAME>                      # 重新啟動 Pod（觸發 Rollout）
# k rollout pause deploy/<NAME>                        # 暫停
# k rollout resume deploy/<NAME>                       # 恢復
# k edit deploy <NAME>                                 # 編輯設定
# k explain deploy.spec.strategy                       # 查欄位定義
#
# 故障排查：
# READY 0/3 → k get po / k describe po / k logs，檢查 Readiness、Image、資源。
# Pending → 檢查 Node 資源、nodeSelector、Taints/Tolerations、PVC。
# CrashLoopBackOff → 檢查 logs、command/args、Liveness；ImagePullBackOff → Image/Registry。
# ProgressDeadlineExceeded → 檢查新 Pod 是否可啟動、Ready、Available；不會自動回滾。
# Rollout 沒動 → 檢查 paused、Pod Events、strategy；Service 無流量 → 檢查 Label/Selector。



# ============================================================
# CKAD 考試重點
# ============================================================

# 1. Deployment 基本觀念
#   - Deployment 用來管理 ReplicaSet，ReplicaSet 再管理 Pod
#   - Deployment → ReplicaSet → Pod
#   - Deployment 可以自動維持指定數量的 Pod
#   - Pod 被刪除後，ReplicaSet 通常會自動建立新的 Pod
#   - Deployment 通常用於無狀態應用程式
#   - Deployment 本身不直接管理 Pod，而是透過 ReplicaSet
#   - replicas 預設為 1
#   - Deployment 的 Pod restartPolicy 必須為 Always

# 2. Labels / Selectors
#   - metadata.labels：Deployment 自身的 Label
#   - spec.selector：Deployment 用來識別所管理 Pod 的條件
#   - spec.template.metadata.labels：Deployment 建立的 Pod Label
#   - selector 必須符合 template.metadata.labels
#   - metadata.labels 不需要與 spec.selector 相同
#   - spec.selector 建立後不可修改
#   - 修改 template.metadata.labels 必須仍符合 selector
#   - matchLabels：所有條件必須符合（AND）
#   - matchExpressions：支援 In、NotIn、Exists、DoesNotExist

# 3. Replicas / Scaling
#   - replicas：Deployment 預期維持的 Pod 數量
#   - replicas: 0：將所有 Pod 縮減至 0
#   - 修改 replicas 不會建立新的 Deployment Revision
#   - scale 可以直接修改副本數量
#   - HPA 可以根據指標自動調整 replicas
#   - 如果 HPA 正在管理 Deployment，手動調整可能被 HPA 覆蓋

# 4. Deployment Strategy
#   - RollingUpdate：逐步建立新 Pod、終止舊 Pod
#   - Recreate：先終止舊 Pod，再建立新 Pod
#   - RollingUpdate 通常能降低更新期間的服務中斷風險
#   - Recreate 更新期間可能出現服務中斷
#   - Recreate 不可以設定 rollingUpdate
#   - maxSurge：允許超過 replicas 的最大 Pod 數量
#   - maxUnavailable：允許不可用的最大 Pod 數量
#   - maxSurge 可設定整數或百分比，百分比向上取整
#   - maxUnavailable 可設定整數或百分比，百分比向下取整
#   - maxSurge 與 maxUnavailable 不可同時為 0

# 5. RollingUpdate 計算
#   - 假設 replicas = 6
#   - maxSurge = 25% → ceil(6 × 25%) = 2
#   - maxUnavailable = 25% → floor(6 × 25%) = 1
#   - 更新期間最多允許 8 個 Pod
#   - 更新期間至少需要 5 個 Available Pod
#   - Pod 是否 Available 取決於 Ready 狀態與 minReadySeconds

# 6. Deployment Revision / Rollback
#   - 修改 spec.template 通常會建立新的 Deployment Revision
#   - 修改 Container Image 會觸發 RollingUpdate
#   - 修改 Pod Template Label / Annotation 也會觸發 RollingUpdate
#   - 修改 replicas 不會建立新的 Revision
#   - revisionHistoryLimit：保留舊 ReplicaSet 供 Rollback 使用
#   - revisionHistoryLimit: 0：不保留舊 ReplicaSet 供 Rollback
#   - Rollback：將 Deployment 恢復到先前的 Pod Template
#   - Rollback 後仍會透過 Deployment Controller 調整 Pod

# 7. minReadySeconds / progressDeadlineSeconds
#   - minReadySeconds：Pod Ready 後必須穩定維持的秒數
#   - minReadySeconds: 0：Ready 後即可視為 Available
#   - progressDeadlineSeconds：Deployment 沒有進展的容忍時間
#   - 超過 progressDeadlineSeconds 可能出現 ProgressDeadlineExceeded
#   - ProgressDeadlineExceeded 不代表 Kubernetes 會自動 Rollback
#   - progressDeadlineSeconds 必須大於 minReadySeconds

# 8. Paused Deployment
#   - paused: true：暫停 Deployment 的 Rollout
#   - paused: false：恢復 Deployment 的 Rollout
#   - 暫停期間可修改 Pod Template，暫不觸發新的 Rollout
#   - 恢復後會處理累積的 Pod Template 變更
#   - Deployment 暫停期間不能執行 Rollback

# 9. Deployment 與 Service
#   - Service 透過自己的 selector 選擇 Pod
#   - Service 不會直接連接 Deployment
#   - Deployment 的 Pod Label 必須符合 Service selector
#   - Deployment 更新時，Service 可持續導流到符合條件且 Ready 的 Pod
#   - readinessProbe 失敗時，Pod 通常會從 Service 可用端點中移除
#   - ContainerPort 只是宣告 Port，不會自動建立 Service

# 10. 常用 kubectl 指令
#   - k create deploy <NAME> --image=<IMAGE>          # 快速建立 Deployment
#   - k create deploy <NAME> --image=<IMAGE> --replicas=3
#   - k create deploy <NAME> --image=<IMAGE> --dry-run=client -o yaml
#   - k get deploy                                    # 查看 Deployment
#   - k get rs                                        # 查看 ReplicaSet
#   - k get po                                        # 查看 Pod
#   - k describe deploy <NAME>                        # 查看 Deployment 詳細資訊
#   - k scale deploy <NAME> --replicas=5               # 調整 Pod 數量
#   - k set image deploy/<NAME> <CONTAINER>=<IMAGE>    # 更新 Image
#   - k rollout status deploy/<NAME>                  # 查看 Rollout 狀態
#   - k rollout history deploy/<NAME>                 # 查看 Revision 歷史
#   - k rollout history deploy/<NAME> --revision=2    # 查看指定 Revision
#   - k rollout undo deploy/<NAME>                    # 回復上一個 Revision
#   - k rollout undo deploy/<NAME> --to-revision=2     # 回復指定 Revision
#   - k rollout restart deploy/<NAME>                 # 重新啟動所有 Pod
#   - k rollout pause deploy/<NAME>                   # 暫停 Rollout
#   - k rollout resume deploy/<NAME>                  # 恢復 Rollout
#   - k edit deploy <NAME>                            # 編輯 Deployment
#   - k delete deploy <NAME>                          # 刪除 Deployment

# 11. CKAD 常見故障排查
#   - READY 0/3 → 檢查 Pod 狀態、Readiness Probe
#   - AVAILABLE 0 → 檢查 Pod Ready 狀態與 minReadySeconds
#   - Pod Pending → 檢查 Node 資源、Affinity、Taints、PVC
#   - ImagePullBackOff → 檢查 Image 名稱、Tag、Registry 權限
#   - CrashLoopBackOff → 檢查 Logs、Command、Args、Probes
#   - ProgressDeadlineExceeded → 檢查 Pod 是否能成功啟動並 Ready
#   - Rollout 卡住 → 檢查 maxSurge、maxUnavailable、Pod Events
#   - Service 無法連接 Pod → 檢查 Service selector 與 Pod Label
#   - 更新 Image 後無變化 → 檢查 Deployment 是否 paused
#   - Rollback 失敗 → 檢查 Revision History 是否存在