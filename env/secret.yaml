apiVersion: v1                         # Secret 使用 Core API Group：v1
kind: Secret                           # 儲存敏感設定（密碼、Token、憑證等）
metadata:
  name: my-secret                      # Secret 名稱；Pod 引用時使用此名稱
  namespace: default                   # Namespace 層級資源，Pod 須在相同 Namespace 才能直接引用
  labels:
    app: myapp                         # 自訂 Label，方便查詢及管理

# ============================================================
# 1. type：Secret 類型
# ============================================================
type: Opaque                           # 預設類型；任意自訂 Key-Value，CKAD 最常使用
# 重要可選值（不同類型可能有必要的 Key 或格式限制）：
# Opaque                               → 一般密碼、API Token、自訂敏感資料
# kubernetes.io/tls                   → TLS 憑證；需 tls.crt、tls.key
# kubernetes.io/dockerconfigjson      → Registry 認證；需 .dockerconfigjson（Docker config JSON）
# kubernetes.io/basic-auth            → 基本認證；通常使用 username、password（至少需其中一個）
# kubernetes.io/ssh-auth              → SSH 私鑰；需 ssh-privatekey
# kubernetes.io/service-account-token → 舊式長期 SA Token；現代通常改用 TokenRequest
# 注意：imagePullSecrets 通常使用 dockerconfigjson 類型；TLS Secret 常用於 Ingress TLS

# ============================================================
# 2. data：Base64 編碼資料
# ============================================================
data:                                  # Key → Base64 字串；支援任意二進位內容
  DB_Host: c3FsMDE=                    # 解碼後：sql01
  DB_User: cm9vdA==                    # 解碼後：root
  DB_Password: cGFzc3dvcmQxMjM=       # 解碼後：password123
# data 的值必須是合法 Base64；Base64 是編碼，不是加密
# Key 區分大小寫，例如 DB_Host 與 DB_HOST 是不同 Key
# 特殊類型 Secret 的必要 Key 也放在 data / stringData 中（例如 tls.crt、tls.key）

# ============================================================
# 3. stringData：明文字串（建立 Secret 時方便使用）
# ============================================================
stringData:                            # 直接輸入字串，不必自行轉 Base64
  DB_Host: "sql01"                     # 與 data.DB_Host 同名：此值優先
  DB_User: "root"                      # 與 data.DB_User 同名：此值優先
  DB_Password: "password123"           # 與 data.DB_Password 同名：此值優先
# data 和 stringData 可以同時存在；相同 Key 以 stringData 優先
# API Server 會將 stringData 合併進 data；重新 get -o yaml 通常看不到 stringData
# stringData 與 Server-Side Apply 的管理方式不太相容，實務上需注意
# stringData 適合示範；實際存放明文密碼的 YAML 檔應妥善保護，勿提交公開 Git

# ============================================================
# 4. immutable：是否允許修改 Secret 資料
# ============================================================
immutable: false                       # false（預設）：可修改 data / stringData
# true  → data / stringData 不可修改，且不能改回 false；通常須刪除並重建或改用新名稱
# false → 允許修改 Secret 資料
# immutable 不代表不能刪除 Secret，也不代表資料已加密

# ============================================================
# CKAD 考試重點
# ============================================================

# 1. 基本觀念
# - Secret 是 Namespace 層級資源，可供同 Namespace 多個 Pod 使用
# - Secret 儲存敏感資料，但 Base64 不等於加密；仍須搭配 RBAC 等權限控管
# - Secret 可透過環境變數、Volume 或 imagePullSecrets 提供給 Pod
# - Secret 與 ConfigMap 的引用方式相似；完整 Pod Schema 請參考 Pod.yaml

# 2. Pod 引用路徑（不重複 Pod Template）
# - spec.containers[].env[].valueFrom.secretKeyRef：單一 Key → 環境變數
# - spec.containers[].envFrom[].secretRef：多個 Key → 環境變數
# - spec.volumes[].secret：將 Secret 的 Key / Value 掛載成檔案
# - spec.imagePullSecrets[].name：指定私有 Registry 的認證 Secret
# - Secret Volume 的 items：指定 Key 與檔案路徑；defaultMode：檔案權限
# - 以 Volume 掛載時，Key 預設是檔名，解碼後的 Value 是檔案內容

# 3. 更新行為
# - env / envFrom：Secret 更新後，既有 Container 的環境變數不會自動更新
# - Secret Volume：更新後檔案通常會在一段同步延遲後更新
# - subPath 掛載：不會自動取得 Secret 更新
# - 更新 Secret 不會自動觸發 Deployment RollingUpdate
# - immutable: true：資料不可再修改；若刪除重建，既有 Pod 可能需要重建才能取得新內容

# 4. Base64 常用指令
# - echo -n 'password123' | base64                  # 編碼；-n 避免把換行一起編入
# - echo 'cGFzc3dvcmQxMjM=' | base64 -d            # Linux 常用解碼方式
# - echo 'cGFzc3dvcmQxMjM=' | base64 -D            # macOS 可使用 -D 解碼
# - k get secret my-secret -o jsonpath='{.data.DB_Password}' | base64 -d

# 5. CKAD 常用 kubectl 指令
# - k get secret                                    # 列出 Secret
# - k get secret -A                                 # 列出所有 Namespace 的 Secret
# - k describe secret <NAME>                        # 查看類型、Key 等（不直接顯示明文）
# - k get secret <NAME> -o yaml                     # 查看完整 YAML（data 為 Base64）
# - k edit secret <NAME>                            # 編輯 Secret（immutable 時不可修改資料）
# - k delete secret <NAME>                          # 刪除 Secret
# - k explain secret                                # 查看欄位說明

# 6. 快速建立 Secret（高頻）
# - k create secret generic my-secret --from-literal=DB_User=root
# - k create secret generic my-secret --from-literal=DB_User=root --from-literal=DB_Password=password123
# - k create secret generic my-secret --from-file=password.txt
# - k create secret generic my-secret --from-file=DB_Password=./password.txt
# - k create secret generic my-secret --from-env-file=secret.env
# - k create secret tls my-tls --cert=tls.crt --key=tls.key
# - k create secret docker-registry my-regcred --docker-server=<SERVER> --docker-username=<USER> --docker-password=<PASSWORD>
# - k create secret generic my-secret --from-literal=KEY=VALUE --dry-run=client -o yaml > secret.yaml

# 7. CKAD 常見故障排查
# - CreateContainerConfigError → 檢查非 optional 的 Secret / Key 是否存在
# - FailedMount                → 檢查 Secret 名稱、Namespace、Volume 引用
# - ImagePullBackOff          → 檢查 Registry 帳密、imagePullSecrets、Image 名稱
# - 環境變數未更新              → 重新建立 Pod（或透過 Deployment 重啟）
# - Volume 檔案未更新          → 檢查 subPath、同步延遲及應用程式是否重新讀取
# - 無法修改 Secret            → 檢查 immutable 是否為 true
# - 解碼結果錯誤               → 檢查 Base64 是否包含多餘換行或字元
