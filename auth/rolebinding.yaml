apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-binding                  # RoleBinding 名稱（可與 Role 名稱不同）
  namespace: default                      # 權限生效的 Namespace；RoleBinding 是 Namespace 層級資源

# ============================================================
# 1. Subjects：將權限授予誰（可同時指定多個）
# ============================================================
subjects:
  - kind: User                            # User：一般使用者；另可使用 Group、ServiceAccount
    name: dev-user                        # Kubernetes 認證後的使用者名稱，不是 kubeconfig.users[].name 的別名
    apiGroup: rbac.authorization.k8s.io   # User / Group 使用此 API Group

  - kind: Group                           # Group：將權限授予整個使用者群組
    name: developers                      # 群組名稱由認證機制提供
    apiGroup: rbac.authorization.k8s.io

  - kind: ServiceAccount                  # ServiceAccount：授權給 Pod 使用的身分
    name: app-sa                           # ServiceAccount 名稱
    namespace: default                    # ServiceAccount 所在 Namespace，可與 RoleBinding 不同
    # ServiceAccount 不設定 apiGroup（核心 API Group）

# ============================================================
# 2. RoleRef：引用哪一份權限定義
# ============================================================
roleRef:
  kind: Role                              # Role：引用本 Namespace 的 Role
                                          # ClusterRole：也可引用 ClusterRole，但權限只在本 Namespace 生效
  name: developer                         # 被引用的 Role / ClusterRole 名稱
  apiGroup: rbac.authorization.k8s.io     # 固定使用此 API Group

# ============================================================
# CKAD 考試重點
# ============================================================
# 1. RoleBinding 本身不定義 rules；它只負責將 Role / ClusterRole 的權限授予 subjects。
# 2. RoleBinding + Role：權限只在 RoleBinding 所屬 Namespace 生效；Role 必須位於相同 Namespace。
# 3. RoleBinding + ClusterRole：將 ClusterRole 的「Namespace 層級資源權限」授予此 Namespace。
#    若要授予整個叢集的權限（包含 Node、Namespace 等 Cluster-scoped 資源），使用 ClusterRoleBinding。
# 4. subjects 可包含 User、Group、ServiceAccount；同一份 RoleBinding 可列多個 subjects。
# 5. ServiceAccount 的 namespace 指的是 SA 的所在位置，不是授權生效的 Namespace。
# 6. roleRef 建立後不可直接修改 kind / name / apiGroup；要換角色通常需刪除並重建 RoleBinding。
# 7. RoleBinding 不會建立 User、Group、ServiceAccount 或 Role；它們需要先存在或由認證系統提供。
# 8. 權限是累加（Allow），RBAC 沒有 Deny 規則；不同 Binding 的權限取聯集。
# 9. kubeconfig 中 users[].name 是本機識別名稱；RBAC User name 必須匹配實際認證身分。
#
# 常用指令：
# k get rolebinding -n <NS>                         # 查看 Namespace 的 RoleBinding
# k describe rolebinding <NAME> -n <NS>             # 查看 Subjects 與 RoleRef
# k create rolebinding <NAME> --role=<ROLE> --user=<USER> -n <NS>
# k create rolebinding <NAME> --clusterrole=<CR> --serviceaccount=<SA_NS>:<SA> -n <NS>
# k auth can-i get pods --as=<USER> -n <NS>         # 模擬指定 User 的權限
# k auth can-i get pods --as=system:serviceaccount:<SA_NS>:<SA> -n <NS>
# k get role <ROLE> -n <NS> -o yaml                 # 檢查實際授予的 rules
#
# 常見排查：
# - Forbidden → 檢查 RoleBinding namespace、roleRef、subjects 與 Role.rules。
# - ServiceAccount 權限不符 → 檢查 SA namespace 與 Pod 的 serviceAccountName。
# - ClusterRole 綁定後仍不能管理 Nodes → RoleBinding 不授予叢集層級權限，需 ClusterRoleBinding。
